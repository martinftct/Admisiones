document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"a4d88720-dfaf-46e8-9d7b-32091dfb57c4\"><\u002Fscript>\n  <script src=\"29fa1251-40ea-426a-a7d2-58a5ce53cafb\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }\n    ::selection { background: var(--color-accent-200); }\n    .print-only { display: none; }\n    @media print {\n      .app-screen { display: none !important; }\n      .print-only { display: block !important; }\n      .print-item { page-break-after: always; padding: 24px; }\n      .print-item:last-child { page-break-after: auto; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"app-screen\" style=\"min-height:100vh; display:flex; flex-direction:column;\">\n\n  <div class=\"nav\" style=\"display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-3) var(--space-6); border-bottom:2px solid var(--color-divider);\">\n    <div style=\"display:flex; align-items:center; justify-content:flex-end; gap:var(--space-3);\">\n      <span title=\"{{ syncStatus }}\" style=\"display:inline-flex; align-items:center; gap:var(--space-2); padding:4px 12px; border-radius:2px; font-size:12px; font-weight:700; letter-spacing:0.02em; background:{{ connBg }}; color:{{ connFg }};\">\n        <span style=\"width:8px; height:8px; border-radius:50%; background:{{ connFg }}; display:inline-block;\"><\u002Fspan>\n        {{ connBadgeLabel }}\n      <\u002Fspan>\n      <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ openSettings }}\" title=\"Configuración de sincronización con OneDrive\">⚙<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; justify-content:center; gap:var(--space-4);\">\n      <img src=\"1302f896-adcb-4e75-8128-fb9275b9b958\" alt=\"Colegio Terranova Internacional\" style=\"height:56px; width:auto;\">\n      <img src=\"827c6074-6c71-4d61-99df-2d86cf0f32cd\" alt=\"International Schools Partnership\" style=\"height:40px; width:auto;\">\n    <\u002Fdiv>\n    <div class=\"nav-brand\" style=\"font-family:var(--font-heading); font-weight:700; letter-spacing:0.02em; font-size:32px; text-align:center; width:100%; align-self:stretch;\">EVALUACIÓN ACADÉMICA — ADMISIONES<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1; max-width:1100px; width:100%; margin:0 auto; padding:var(--space-8) var(--space-6); box-sizing:border-box;\">\n\n    <sc-if value=\"{{ isLista }}\" hint-placeholder-val=\"{{ true }}\">\n\n      <div class=\"card elev-sm\" style=\"margin-bottom:var(--space-8);\">\n        <div class=\"card-kicker\" style=\"color:var(--color-accent-700);\">ADMISIONES — REGISTRAR ASPIRANTE<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:2fr 1fr auto; gap:var(--space-3); align-items:flex-end; margin-top:var(--space-3);\">\n          <div class=\"field\" style=\"margin-bottom:0;\">\n            <label>Nombre del aspirante<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"Nombre completo\" value=\"{{ registroNombre }}\" sc-camel-on-change=\"{{ updateRegistroNombre }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:0;\">\n            <label>Curso al que aspira<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{ registroCurso }}\" sc-camel-on-change=\"{{ updateRegistroCurso }}\">\n              <option value=\"\">Selecciona un curso<\u002Foption>\n              <sc-for list=\"{{ cursoOpciones }}\" as=\"op\" hint-placeholder-count=\"0\">\n                <option value=\"{{ op }}\">{{ op }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u00 {{ fMat.comentario }}\" sc-camel-on-change=\"{{ updateFMat }}\" data-field=\"comentario\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Plan de nivelación<\u002Flabel>\n              <sc-raw-select class=\"input\" value=\"{{ fMat.planNivel }}\" sc-camel-on-change=\"{{ updateFMat }}\" data-field=\"planNivel\">\n                <option value=\"No requiere nivelación\">No requiere nivelación<\u002Foption>\n                <option value=\"Nivelación leve (refuerzo puntual)\">Nivelación leve (refuerzo puntual)<\u002Foption>\n                <option value=\"Nivelación media (curso de apoyo)\">Nivelación media (curso de apoyo)<\u002Foption>\n                <option value=\"Nivelación intensiva\">Nivelación intensiva<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Detalle del plan (opcional)<\u002Flabel>\n              <textarea class=\"input\" rows=\"2\" value=\"{{ fMat.planDetalle }}\" sc-camel-on-change=\"{{ updateFMat }}\" data-field=\"planDetalle\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ submitMat }}\" disabled=\"{{ !fMat.calificacion }}\">Guardar<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMateriaDireccion }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card elev-sm\" style=\"border-color:var(--color-accent);\">\n          <div class=\"card-kicker\" style=\"color:var(--color-accent-700);\">DIRECCIÓN<\u002Fdiv>\n          <sc-if value=\"{{ showDecReadonly }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-weight:700; margin:var(--space-1) 0;\">{{ casoDetail.decDecision }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:var(--color-neutral-700);\">{{ casoDetail.decComment }}<\u002Fdiv>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ editDec }}\" style=\"margin-top:var(--space-3);\">Editar<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showDecForm }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"field\">\n              <label>Decisión de admisión<\u002Flabel>\n              <div style=\"display:flex; flex-direction:column; gap:var(--space-2);\">\n                <label class=\"radio\"><input type=\"radio\" name=\"decision\" checked=\"{{ fDec.decisionAdmitido }}\" sc-camel-on-change=\"{{ updateFDec }}\" data-field=\"decision\" data-value=\"Admitido\"><span class=\"dot\"><\u002Fspan> Admitido<\u002Flabel>\n                <label class=\"radio\"><input type=\"radio\" name=\"decision\" checked=\"{{ fDec.decisionNoAdmitido }}\" sc-camel-on-change=\"{{ updateFDec }}\" data-field=\"decision\" data-value=\"No admitido\"><span class=\"dot\"><\u002Fspan> No admitido<\u002Flabel>\n                <label class=\"radio\"><input type=\"radio\" name=\"decision\" checked=\"{{ fDec.decisionCondicional }}\" sc-camel-on-change=\"{{ updateFDec }}\" data-field=\"decision\" data-value=\"Admitido condicional\"><span class=\"dot\"><\u002Fspan> Admitido condicional<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Comentario / conclusiones<\u002Flabel>\n              <textarea class=\"input\" rows=\"3\" value=\"{{ fDec.comentario }}\" sc-camel-on-change=\"{{ updateFDec }}\" data-field=\"comentario\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ submitDec }}\">Guardar decisión<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ settingsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\">\n      <div class=\"dialog\" style=\"max-width:560px;\">\n        <div class=\"dialog-title\">Sincronización con OneDrive / Excel<\u002Fdiv>\n        <div class=\"dialog-body\">\n          <p style=\"font-size:13px; color:var(--color-neutral-700); margin-top:0;\">\n            Para sincronizar en vivo necesitas registrar una app en Azure AD (Microsoft Entra) con permisos delegados\n            <strong>Files.ReadWrite<\u002Fstrong>, <strong>offline_access<\u002Fstrong> y <strong>User.Read<\u002Fstrong>, y usar como\n            Redirect URI la URL exacta de esta página. En OneDrive, el archivo Excel debe tener una <strong>tabla<\u002Fstrong>\n            con estas columnas en orden: ID, Alumno, Curso, Rol, Materia, Calificación, FechaHora, ComentarioNivel,\n            PlanNivelacion, PlanNivelacionDetalle, DecisionAdmision, ComentarioDireccion.\n          <\u002Fp>\n          <div class=\"field\">\n            <label>Client ID de la app Azure AD<\u002Flabel>\n            <input class=\"input\" type=\"text\" value=\"{{ configDraft.clientId }}\" sc-camel-on-change=\"{{ updateConfigDraft }}\" data-field=\"clientId\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Ruta del archivo Excel en OneDrive (ej: Admisiones/Evaluaciones.xlsx)<\u002Flabel>\n            <input class=\"input\" type=\"text\" value=\"{{ configDraft.excelPath }}\" sc-camel-on-change=\"{{ updateConfigDraft }}\" data-field=\"excelPath\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Nombre de la tabla dentro del Excel<\u002Flabel>\n            <input class=\"input\" type=\"text\" value=\"{{ configDraft.tableName }}\" sc-camel-on-change=\"{{ updateConfigDraft }}\" data-field=\"tableName\">\n          <\u002Fdiv>\n          <sc-if value=\"{{ syncStatus }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:13px; color:var(--color-accent-700); font-weight:700;\">Estado: {{ syncStatus }}<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ pendingCount }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:13px; color:var(--color-accent-700);\">{{ pendingCount }} registros pendientes de sincronizar.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ lastSync }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:12px; color:var(--color-neutral-600);\">Última sincronización: {{ lastSync }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ closeSettings }}\">Cerrar<\u002Fbutton>\n          <sc-if value=\"{{ connected }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ syncNow }}\">Sincronizar ahora<\u002Fbutton>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ disconnect }}\">Desconectar<\u002Fbutton>\n          <\u002Fsc-if>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ connect }}\">{{ connectLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<div class=\"print-only\">\n  <sc-for list=\"{{ printList }}\" as=\"c\" hint-placeholder-count=\"0\">\n    <div class=\"print-item\">\n      <h2 style=\"font-family:Archivo, sans-serif; margin:0 0 4px 0;\">{{ c.alumno }}<\u002Fh2>\n      <p style=\"margin:0 0 12px 0;\">Curso: {{ c.curso }} — Decisión: {{ c.decDecision }} — Completado: {{ c.fechaCompletado }}<\u002Fp>\n      <hr>\n      <h3>Inglés — {{ c.ingScore }}<\u002Fh3>\n      <p style=\"white-space:pre-wrap;\">{{ c.ingComment }}<\u002Fp>\n      <p>Plan: {{ c.ingPlan }}<\u002Fp>\n      <h3>Español — {{ c.espScore }}<\u002Fh3>\n      <p style=\"white-space:pre-wrap;\">{{ c.espComment }}<\u002Fp>\n      <p>Plan: {{ c.espPlan }}<\u002Fp>\n      <h3>Matemáticas — {{ c.matScore }}<\u002Fh3>\n      <p style=\"white-space:pre-wrap;\">{{ c.matComment }}<\u002Fp>\n      <p>Plan: {{ c.matPlan }}<\u002Fp>\n      <h3>Comentario de dirección<\u002Fh3>\n      <p style=\"white-space:pre-wrap;\">{{ c.decComment }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst BLANK_SUBJ = { calificacion: '', comentario: '', planNivel: 'No requiere nivelación', planDetalle: '' };\nconst BLANK_DEC = { decision: 'Admitido', comentario: '' };\n\nclass Component extends DCLogic {\n  state = {\n    submissions: [],\n    config: { clientId: '', excelPath: '', tableName: 'Evaluaciones' },\n    connected: false,\n    account: null,\n    syncStatus: 'Sin conectar',\n    lastSync: null,\n    settingsOpen: false,\n    view: 'lista',\n    selectedAlumno: '',\n    selectedMateria: '',\n    registroNombre: '',\n    registroCurso: '',\n    editing: null,\n    seleccionados: [],\n    editingAlumno: null,\n    editNombre: '',\n    editCurso: '',\n    fIng: { ...BLANK_SUBJ },\n    fEsp: { ...BLANK_SUBJ },\n    fMat: { ...BLANK_SUBJ },\n    fDec: { ...BLANK_DEC },\n    configDraft: null,\n  };\n\n  componentDidMount() {\n    try {\n      const savedConfig = JSON.parse(localStorage.getItem('admisiones_config') || 'null');\n      const savedSubs = JSON.parse(localStorage.getItem('admisiones_submissions') || '[]');\n      if (savedConfig) this.setState({ config: savedConfig });\n      this.setState({ submissions: savedSubs });\n      if (savedConfig && savedConfig.clientId) this.initMsal(savedConfig);\n    } catch (e) {}\n    this._poll = setInterval(() => { if (this.state.connected) this.fetchRows(); }, 20000);\n  }\n  componentWillUnmount() { clearInterval(this._poll); }\n\n  saveSubs(subs) { localStorage.setItem('admisiones_submissions', JSON.stringify(subs)); }\n\n  initMsal(config) {\n    if (!window.msal) { this.setState({ syncStatus: 'Cargando librería…' }); setTimeout(() => this.initMsal(config), 500); return; }\n    try {\n      this._msal = new window.msal.PublicClientApplication({\n        auth: { clientId: config.clientId, authority: 'https://login.microsoftonline.com/common', redirectUri: window.location.origin + window.location.pathname }\n      });\n      this._msalReady = this._msal.initialize().then(() => this._msal.handleRedirectPromise()).then(res => {\n        if (res && res.account) {\n          this.setState({ account: res.account, connected: true, syncStatus: 'Conectado', settingsOpen: false });\n          this.fetchRows();\n          return;\n        }\n        const accounts = this._msal.getAllAccounts();\n        if (accounts[0]) {\n          this.setState({ account: accounts[0], connected: true, syncStatus: 'Conectado' });\n          this.fetchRows();\n        }\n      }).catch(e => this.setState({ syncStatus: 'Error al conectar: ' + e.message }));\n    } catch (e) { this.setState({ syncStatus: 'Error de configuración: ' + e.message }); }\n  }\n\n  async connect() {\n    const config = this.state.configDraft || this.state.config;\n    localStorage.setItem('admisiones_config', JSON.stringify(config));\n    this.setState({ config });\n    if (!config.clientId || !config.excelPath || !config.tableName) {\n      this.setState({ syncStatus: 'Completa los campos de configuración' });\n      return;\n    }\n    if (!window.msal) {\n      this.setState({ syncStatus: 'Cargando librería… vuelve a hacer clic en 1-2 segundos' });\n      return;\n    }\n    this.initMsal(config);\n    try {\n      await this._msalReady;\n      await this._msal.loginRedirect({ scopes: ['Files.ReadWrite', 'offline_access', 'User.Read'] });\n    } catch (e) {\n      this.setState({ syncStatus: 'Error al conectar: ' + e.message });\n    }\n  }\n\n  disconnect() {\n    if (this._msal && this.state.account) { this._msal.logoutRedirect({ account: this.state.account }); return; }\n    this.setState({ connected: false, account: null, syncStatus: 'Sin conectar' });\n  }\n\n  async getToken() {\n    const req = { scopes: ['Files.ReadWrite', 'offline_access'], account: this.state.account };\n    try { return (await this._msal.acquireTokenSilent(req)).accessToken; }\n    catch (e) { return (await this._msal.acquireTokenPopup(req)).accessToken; }\n  }\n\n  graphUrl(suffix) {\n    const path = this.state.config.excelPath.replace(/^\\/+/, '');\n    return 'https://graph.microsoft.com/v1.0/me/drive/root:/' + path.split('/').map(encodeURIComponent).join('/') + ':' + suffix;\n  }\n\n  decisionColor(decision) {\n    if (decision === 'Admitido') return '#1a7f37';\n    if (decision === 'Admitido condicional') return '#d4a017';\n    if (decision === 'No admitido') return 'var(--color-accent-500)';\n    return 'var(--color-neutral-300)';\n  }\n  rowFromSubmission(s) {\n    return [s.id, s.alumno, s.curso, s.rolLabel, s.materia, s.calificacion, s.fechaHora, s.comentario, s.planNivel, s.planDetalle, s.decision, s.comentarioDireccion];\n  }\n  submissionFromRow(r) {\n    return { id: r[0], alumno: r[1], curso: r[2], rolLabel: r[3], materia: r[4], calificacion: r[5], fechaHora: r[6], comentario: r[7], planNivel: r[8], planDetalle: r[9], decision: r[10], comentarioDireccion: r[11], synced: true };\n  }\n\n  async syncRow(sub) {\n    if (!this.state.connected) return false;\n    try {\n      const token = await this.getToken();\n      const tableName = encodeURIComponent(this.state.config.tableName);\n      const url = this.graphUrl(`/workbook/tables('${tableName}')/rows/add`);\n      const res = await fetch(url, { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [this.rowFromSubmission(sub)] }) });\n      if (!res.ok) throw new Error(await res.text());\n      return true;\n    } catch (e) {\n      this.setState({ syncStatus: 'Error al sincronizar: ' + e.message });\n      return false;\n    }\n  }\n\n  async syncAll() {\n    const pending = this.state.submissions.filter(s => !s.synced);\n    const subs = [...this.state.submissions];\n    for (const s of pending) {\n      const ok = await this.syncRow(s);\n      if (ok) { const idx = subs.findIndex(x => x.id === s.id); if (idx >= 0) subs[idx] = { ...subs[idx], synced: true }; }\n    }\n    this.setState({ submissions: subs });\n    this.saveSubs(subs);\n    this.fetchRows();\n  }\n\n  async fetchRows() {\n    if (!this.state.connected) return;\n    try {\n      const token = await this.getToken();\n      const tableName = encodeURIComponent(this.state.config.tableName);\n      const url = this.graphUrl(`/workbook/tables('${tableName}')/rows`);\n      const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });\n      if (!res.ok) throw new Error(await res.text());\n      const data = await res.json();\n      const remote = (data.value || []).map(r => this.submissionFromRow(r.values[0]));\n      const localOnly = this.state.submissions.filter(s => !remote.find(r => r.id === s.id));\n      const merged = [...remote, ...localOnly];\n      this.setState({ submissions: merged, lastSync: new Date().toLocaleTimeString('es-CO'), syncStatus: 'Conectado' });\n      this.saveSubs(merged);\n    } catch (e) {\n      this.setState({ syncStatus: 'Error al leer datos: ' + e.message });\n    }\n  }\n\n  updateRegistroNombre(e) { this.setState({ registroNombre: e.target.value }); }\n  updateRegistroCurso(e) { this.setState({ registroCurso: e.target.value }); }\n  updateConfigDraft(e) {\n    const field = e.currentTarget.dataset.field;\n    const base = this.state.configDraft || this.state.config;\n    this.setState({ configDraft: { ...base, [field]: e.target.value } });\n  }\n  updateForm(key, e) {\n    const field = e.currentTarget.dataset.field;\n    const value = field === 'decision' ? e.currentTarget.dataset.value : e.target.value;\n    this.setState({ [key]: { ...this.state[key], [field]: value } });\n  }\n\n  nowStr() { return new Date().toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }); }\n\n  async pushRow(sub) {\n    const subs = [sub, ...this.state.submissions];\n    this.setState({ submissions: subs });\n    this.saveSubs(subs);\n    if (this.state.connected) {\n      const ok = await this.syncRow(sub);\n      if (ok) {\n        const subs2 = this.state.submissions.map(s => s.id === sub.id ? { ...s, synced: true } : s);\n        this.setState({ submissions: subs2 });\n        this.saveSubs(subs2);\n      }\n    }\n  }\n  async updateRow(id, patch) {\n    const subs = this.state.submissions.map(s => s.id === id ? { ...s, ...patch, synced: false } : s);\n    this.setState({ submissions: subs });\n    this.saveSubs(subs);\n    if (this.state.connected) {\n      const updated = subs.find(s => s.id === id);\n      const ok = await this.syncRow(updated);\n      if (ok) {\n        const subs2 = this.state.submissions.map(s => s.id === id ? { ...s, synced: true } : s);\n        this.setState({ submissions: subs2 });\n        this.saveSubs(subs2);\n      }\n    }\n  }\n\n  registrarCaso() {\n    const nombre = this.state.registroNombre.trim();\n    const curso = this.state.registroCurso.trim();\n    if (!nombre || !curso) return;\n    const sub = {\n      id: 'c' + Date.now() + Math.random().toString(36).slice(2, 7),\n      alumno: nombre, curso, rolLabel: 'Admisiones', materia: 'Caso', calificacion: '',\n      fechaHora: this.nowStr(), comentario: '', planNivel: '', planDetalle: '', decision: '', comentarioDireccion: '', synced: false,\n    };\n    this.setState({ registroNombre: '', registroCurso: '' });\n    this.pushRow(sub);\n  }\n\n  findEntry(alumno, materia) { return this.state.submissions.find(s => s.alumno === alumno && s.materia === materia); }\n\n  startCasoEdit(e) {\n    this.setState({ editingAlumno: e.currentTarget.dataset.name, editNombre: e.currentTarget.dataset.name, editCurso: e.currentTarget.dataset.curso });\n  }\n  cancelCasoEdit() { this.setState({ editingAlumno: null, editNombre: '', editCurso: '' }); }\n  updateEditNombre(e) { this.setState({ editNombre: e.target.value }); }\n  updateEditCurso(e) { this.setState({ editCurso: e.target.value }); }\n\n  async saveCasoEdit() {\n    const oldAlumno = this.state.editingAlumno;\n    const newNombre = this.state.editNombre.trim();\n    const newCurso = this.state.editCurso.trim();\n    if (!newNombre || !newCurso) return;\n    const affected = this.state.submissions.filter(s => s.alumno === oldAlumno);\n    const subs = this.state.submissions.map(s => s.alumno === oldAlumno ? { ...s, alumno: newNombre, curso: newCurso, synced: false } : s);\n    this.setState({ submissions: subs, editingAlumno: null, editNombre: '', editCurso: '' });\n    this.saveSubs(subs);\n    if (this.state.connected) {\n      for (const row of affected) {\n        const ok = await this.syncRow({ ...row, alumno: newNombre, curso: newCurso });\n        if (ok) {\n          const subs2 = this.state.submissions.map(s => s.id === row.id ? { ...s, synced: true } : s);\n          this.setState({ submissions: subs2 });\n          this.saveSubs(subs2);\n        }\n      }\n    }\n  }\n\n  selectMateria(e) {\n    const alumno = e.currentTarget.dataset.name;\n    const materia = e.currentTarget.dataset.materia;\n    this.setState({\n      selectedAlumno: alumno, selectedMateria: materia, view: 'materia', editing: null,\n      fIng: { ...BLANK_SUBJ }, fEsp: { ...BLANK_SUBJ }, fMat: { ...BLANK_SUBJ }, fDec: { ...BLANK_DEC },\n    });\n  }\n  backToList() { this.setState({ view: 'lista', selectedAlumno: '', selectedMateria: '' }); }\n  goCompletados() { this.setState({ view: 'completados' }); }\n\n  editSection(materia, formKey) {\n    const entry = this.findEntry(this.state.selectedAlumno, materia);\n    if (materia === 'Dirección') {\n      this.setState({ fDec: entry ? { decision: entry.decision, comentario: entry.comentarioDireccion } : { ...BLANK_DEC }, editing: 'direccion' });\n    } else {\n      this.setState({ [formKey]: entry ? { calificacion: entry.calificacion, comentario: entry.comentario, planNivel: entry.planNivel, planDetalle: entry.planDetalle } : { ...BLANK_SUBJ }, editing: materia });\n    }\n  }\n\n  async submitSubject(materia, rolLabel, formKey) {\n    const { selectedAlumno } = this.state;\n    const f = this.state[formKey];\n    if (f.calificacion === '') return;\n    const casoRow = this.findEntry(selectedAlumno, 'Caso');\n    const existing = this.findEntry(selectedAlumno, materia);\n    if (existing) {\n      await this.updateRow(existing.id, { calificacion: f.calificacion, comentario: f.comentario, planNivel: f.planNivel, planDetalle: f.planDetalle, fechaHora: this.nowStr() });\n    } else {\n      const sub = {\n        id: 'e' + Date.now() + Math.random().toString(36).slice(2, 7),\n        alumno: selectedAlumno, curso: casoRow ? casoRow.curso : '', rolLabel, materia,\n        calificacion: f.calificacion, fechaHora: this.nowStr(), comentario: f.comentario, planNivel: f.planNivel, planDetalle: f.planDetalle,\n        decision: '', comentarioDireccion: '', synced: false,\n      };\n      await this.pushRow(sub);\n    }\n    this.setState({ editing: null, view: 'lista', selectedAlumno: '', selectedMateria: '' });\n  }\n\n  async submitDireccion() {\n    const { selectedAlumno, fDec } = this.state;\n    const casoRow = this.findEntry(selectedAlumno, 'Caso');\n    const existing = this.findEntry(selectedAlumno, 'Dirección');\n    if (existing) {\n      await this.updateRow(existing.id, { decision: fDec.decision, comentarioDireccion: fDec.comentario, fechaHora: this.nowStr() });\n    } else {\n      const sub = {\n        id: 'd' + Date.now() + Math.random().toString(36).slice(2, 7),\n        alumno: selectedAlumno, curso: casoRow ? casoRow.curso : '', rolLabel: 'Dirección', materia: 'Dirección', calificacion: '',\n        fechaHora: this.nowStr(), comentario: '', planNivel: '', planDetalle: '',\n        decision: fDec.decision, comentarioDireccion: fDec.comentario, synced: false,\n      };\n      await this.pushRow(sub);\n    }\n    this.setState({ editing: null, view: 'lista', selectedAlumno: '', selectedMateria: '' });\n  }\n\n  toggleSeleccion(e) {\n    const alumno = e.currentTarget.dataset.name;\n    const sel = this.state.seleccionados.includes(alumno) ? this.state.seleccionados.filter(a => a !== alumno) : [...this.state.seleccionados, alumno];\n    this.setState({ seleccionados: sel });\n  }\n  toggleSeleccionTodos(completados) {\n    const allNames = completados.map(c => c.alumno);\n    const allSelected = allNames.every(n => this.state.seleccionados.includes(n));\n    this.setState({ seleccionados: allSelected ? [] : allNames });\n  }\n\n  filaTexto(c) {\n    return [c.alumno, c.curso, c.ingScore, c.ingComment, c.ingPlan, c.espScore, c.espComment, c.espPlan, c.matScore, c.matComment, c.matPlan, c.decDecision, c.decComment, c.fechaCompletado].join('\\t');\n  }\n\n  copiarSeleccionados(completados) {\n    const rows = completados.filter(c => this.state.seleccionados.includes(c.alumno));\n    if (!rows.length) return;\n    const header = ['Alumno', 'Curso', 'Calif. Inglés', 'Comentario Inglés', 'Plan Inglés', 'Calif. Español', 'Comentario Español', 'Plan Español', 'Calif. Matemáticas', 'Comentario Matemáticas', 'Plan Matemáticas', 'Decisión', 'Comentario Dirección', 'Fecha de finalización'].join('\\t');\n    const text = [header, ...rows.map(r => this.filaTexto(r))].join('\\n');\n    navigator.clipboard.writeText(text).then(() => this.setState({ syncStatus: 'Copiado al portapapeles' }));\n  }\n\n  descargarExcel(completados) {\n    const headers = ['Alumno', 'Curso', 'Calif. Inglés', 'Comentario Inglés', 'Plan Inglés', 'Calif. Español', 'Comentario Español', 'Plan Español', 'Calif. Matemáticas', 'Comentario Matemáticas', 'Plan Matemáticas', 'Decisión', 'Comentario Dirección', 'Fecha de finalización'];\n    const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;');\n    let html = '<table border=\"1\"><tr>' + headers.map(h => `<th>${esc(h)}<\u002Fth>`).join('') + '<\u002Ftr>';\n    completados.forEach(r => {\n      html += '<tr>' + [r.alumno, r.curso, r.ingScore, r.ingComment, r.ingPlan, r.espScore, r.espComment, r.espPlan, r.matScore, r.matComment, r.matPlan, r.decDecision, r.decComment, r.fechaCompletado].map(v => `<td>${esc(v)}<\u002Ftd>`).join('') + '<\u002Ftr>';\n    });\n    html += '<\u002Ftable>';\n    const blob = new Blob(['\\ufeff' + html], { type: 'application/vnd.ms-excel' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'admisiones.xls';\n    a.click();\n  }\n\n  buildResumen(submissions, alumno) {\n    const caso = submissions.find(s => s.alumno === alumno && s.materia === 'Caso');\n    const ing = submissions.find(s => s.alumno === alumno && s.materia === 'Inglés');\n    const esp = submissions.find(s => s.alumno === alumno && s.materia === 'Español');\n    const mat = submissions.find(s => s.alumno === alumno && s.materia === 'Matemáticas');\n    const dec = submissions.find(s => s.alumno === alumno && s.materia === 'Dirección');\n    return {\n      curso: caso ? caso.curso : '', ing, esp, mat, dec,\n      ingScore: ing ? ing.calificacion : '—', ingComment: ing ? ing.comentario : 'Pendiente', ingPlan: ing ? (ing.planNivel + (ing.planDetalle ? ' — ' + ing.planDetalle : '')) : '—',\n      espScore: esp ? esp.calificacion : '—', espComment: esp ? esp.comentario : 'Pendiente', espPlan: esp ? (esp.planNivel + (esp.planDetalle ? ' — ' + esp.planDetalle : '')) : '—',\n      matScore: mat ? mat.calificacion : '—', matComment: mat ? mat.comentario : 'Pendiente', matPlan: mat ? (mat.planNivel + (mat.planDetalle ? ' — ' + mat.planDetalle : '')) : '—',\n      hasDecision: !!dec, decDecision: dec ? dec.decision : '', decComment: dec ? dec.comentarioDireccion : '',\n      decColor: this.decisionColor(dec ? dec.decision : ''),\n      fechaCompletado: dec ? dec.fechaHora : '',\n    };\n  }\n\n  renderVals() {\n    const { submissions, connected, syncStatus, lastSync, settingsOpen, config, view, selectedAlumno, selectedMateria, registroNombre, registroCurso, editing, editingAlumno, editNombre, editCurso, fIng, fEsp, fMat, fDec } = this.state;\n    const configDraft = this.state.configDraft || config;\n    const cursoOpciones = ['TINY', 'PK', 'KINDER', '2do de Básica', '3ro de Básica', '4to de Básica', '5to de Básica', '6to de Básica', '7mo de Básica', '8vo de Básica', '9no de Básica', '10mo de Básica', '1ro de Bachillerato', '2do de Bachillerato', '3ro de Bachillerato'];\n\n    const OK_STYLE = 'background:#1a7f37; color:#fff; border-color:#1a7f37;';\n    const casoRows = submissions.filter(s => s.materia === 'Caso' && s.alumno && s.alumno.trim() && s.curso && s.curso.trim());\n    const all = casoRows.map(c => {\n      const r = this.buildResumen(submissions, c.alumno);\n      return {\n        alumno: c.alumno, curso: r.curso, hasDec: !!r.dec,\n        ingLabel: r.ing ? 'OK' : 'Pendiente', ingClass: r.ing ? '' : 'tag-outline', ingStyle: r.ing ? OK_STYLE : '',\n        espLabel: r.esp ? 'OK' : 'Pendiente', espClass: r.esp ? '' : 'tag-outline', espStyle: r.esp ? OK_STYLE : '',\n        matLabel: r.mat ? 'OK' : 'Pendiente', matClass: r.mat ? '' : 'tag-outline', matStyle: r.mat ? OK_STYLE : '',\n        decLabel: r.dec ? 'OK' : 'Pendiente', decClass: r.dec ? '' : 'tag-outline', decStyle: r.dec ? OK_STYLE : '',\n        ingScore: r.ingScore, ingComment: r.ingComment, ingPlan: r.ingPlan,\n        espScore: r.espScore, espComment: r.espComment, espPlan: r.espPlan,\n        matScore: r.matScore, matComment: r.matComment, matPlan: r.matPlan,\n        decDecision: r.decDecision, decComment: r.decComment, fechaCompletado: r.fechaCompletado,\n        decColor: r.decColor, decEstado: r.decDecision || 'Pendiente',\n      };\n    });\n    const pendientes = all.filter(c => !c.hasDec);\n    const noPendientes = pendientes.length === 0;\n    const completados = all.filter(c => c.hasDec).map(c => ({ ...c, isSelected: this.state.seleccionados.includes(c.alumno) }));\n    const todosSeleccionados = completados.length > 0 && completados.every(c => c.isSelected);\n    const seleccionSet = new Set(this.state.seleccionados);\n    const printList = seleccionSet.size ? completados.filter(c => seleccionSet.has(c.alumno)) : completados;\n    const fDecView = { ...fDec, decisionAdmitido: fDec.decision === 'Admitido', decisionNoAdmitido: fDec.decision === 'No admitido', decisionCondicional: fDec.decision === 'Admitido condicional' };\n\n    const casoDetail = selectedAlumno ? this.buildResumen(submissions, selectedAlumno) : {};\n\n    const pendingCount = submissions.filter(s => !s.synced).length;\n\n    return {\n      connected, syncStatus, lastSync, pendingCount,\n      connBadgeLabel: connected ? 'Conectado' : 'Desconectado',\n      connBg: connected ? '#e6f4ea' : '#fdeceb',\n      connFg: connected ? '#1a7f37' : 'var(--color-accent-700)',\n      settingsOpen, configDraft, cursoOpciones,\n      isLista: view === 'lista', isMateria: view === 'materia', isCompletados: view === 'completados',\n      goCompletados: () => this.goCompletados(),\n      isMateriaIngles: selectedMateria === 'Inglés', isMateriaEspanol: selectedMateria === 'Español',\n      isMateriaMatematicas: selectedMateria === 'Matemáticas', isMateriaDireccion: selectedMateria === 'Dirección',\n      registroNombre, registroCurso, canRegistrar: !!(registroNombre.trim() && registroCurso.trim()),\n      pendientes, noPendientes, completados, todosSeleccionados, printList,\n      toggleSeleccion: (e) => this.toggleSeleccion(e),\n      toggleSeleccionTodos: () => this.toggleSeleccionTodos(completados),\n      copiarSeleccionados: () => this.copiarSeleccionados(completados),\n      descargarExcel: () => this.descargarExcel(completados),\n      imprimir: () => window.print(),\n      hasEditingAlumno: !!editingAlumno,\n      editNombre, editCurso,\n      startCasoEdit: (e) => this.startCasoEdit(e),\n      cancelCasoEdit: () => this.cancelCasoEdit(),\n      saveCasoEdit: () => this.saveCasoEdit(),\n      updateEditNombre: (e) => this.updateEditNombre(e),\n      updateEditCurso: (e) => this.updateEditCurso(e),\n      selectedAlumno, selectedMateria, casoDetail,\n      showIngReadonly: !!casoDetail.ing && editing !== 'Inglés',\n      showIngForm: !casoDetail.ing || editing === 'Inglés',\n      showEspReadonly: !!casoDetail.esp && editing !== 'Español',\n      showEspForm: !casoDetail.esp || editing === 'Español',\n      showMatReadonly: !!casoDetail.mat && editing !== 'Matemáticas',\n      showMatForm: !casoDetail.mat || editing === 'Matemáticas',\n      showDecReadonly: !!casoDetail.dec && editing !== 'direccion',\n      showDecForm: !casoDetail.dec || editing === 'direccion',\n      fIng, fEsp, fMat, fDec: fDecView,\n      connectLabel: connected ? 'Reconectar' : 'Conectar con OneDrive',\n      openSettings: () => this.setState({ settingsOpen: true, configDraft: { ...config } }),\n      closeSettings: () => this.setState({ settingsOpen: false }),\n      updateConfigDraft: (e) => this.updateConfigDraft(e),\n      connect: () => this.connect(),\n      disconnect: () => this.disconnect(),\n      syncNow: () => this.syncAll(),\n      updateRegistroNombre: (e) => this.updateRegistroNombre(e),\n      updateRegistroCurso: (e) => this.updateRegistroCurso(e),\n      registrarCaso: () => this.registrarCaso(),\n      selectMateria: (e) => this.selectMateria(e),\n      backToList: () => this.backToList(),\n      editIng: () => this.editSection('Inglés', 'fIng'),\n      editEsp: () => this.editSection('Español', 'fEsp'),\n      editMat: () => this.editSection('Matemáticas', 'fMat'),\n      editDec: () => this.editSection('Dirección', 'fDec'),\n      updateFIng: (e) => this.updateForm('fIng', e),\n      updateFEsp: (e) => this.updateForm('fEsp', e),\n      updateFMat: (e) => this.updateForm('fMat', e),\n      updateFDec: (e) => this.updateForm('fDec', e),\n      submitIng: () => this.submitSubject('Inglés', 'Profesor de Inglés', 'fIng'),\n      submitEsp: () => this.submitSubject('Español', 'Profesor de Español', 'fEsp'),\n      submitMat: () => this.submitSubject('Matemáticas', 'Profesor de Matemáticas', 'fMat'),\n      submitDec: () => this.submitDireccion(),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
